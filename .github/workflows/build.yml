name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK (preinstalled on GitHub runners)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - APK is debug-signed and will NOT be published as a release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check signing secrets
        if: steps.key.outputs.signed == 'true'
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          ALIAS="$(echo -n "$ALIAS" | tr -d '[:space:]')"; PW="$(echo -n "$PW" | tr -d '[:space:]')"
          echo "::notice::keystore size=$(wc -c < "$KS") sha256=$(sha256sum "$KS" | cut -c1-16) | password length=${#PW} | alias length=${#ALIAS}"
          if ! keytool -list -keystore "$KS" -storepass "$PW" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::keytool cannot open the keystore: $(grep -v JAVA_TOOL "$RUNNER_TEMP/ks.txt" | head -2 | tr '\n' ' ')"
            exit 1
          fi
          if ! grep -qi "^${ALIAS:-screendestroyer}," "$RUNNER_TEMP/ks.txt"; then
            echo "::error::alias '${ALIAS}' not found. Aliases: $(grep -i privatekeyentry "$RUNNER_TEMP/ks.txt" | cut -d, -f1 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::signing secrets OK"
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../screen-destroyer.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs ../screen-destroyer.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: screen-destroyer.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build AppImage + deb
        working-directory: linux
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            linux/dist/*.AppImage
            linux/dist/*.deb

  release:
    # Every successful build on main (or a v* tag) publishes a GitHub Release
    # named after the version in linux/package.json, e.g. v1.0.0.
    # Only publish APKs signed with the real release key.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.android.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [android, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: ver
        run: echo "tag=v$(node -p "require('./linux/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Collect files
        run: |
          mkdir -p release
          cp out/android-apk/screen-destroyer.apk "release/screen-destroyer-${{ steps.ver.outputs.tag }}.apk"
          for f in out/linux/*.AppImage; do cp "$f" "release/screen-destroyer-${{ steps.ver.outputs.tag }}-linux-x86_64.AppImage"; done
          for f in out/linux/*.deb; do cp "$f" "release/screen-destroyer-${{ steps.ver.outputs.tag }}-linux-amd64.deb"; done
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Screen Destroyer ${{ steps.ver.outputs.tag }}
          make_latest: true
          overwrite_files: true
          body: |
            ## دانلود
            - **اندروید:** `screen-destroyer-${{ steps.ver.outputs.tag }}.apk` — دانلود و نصب کن (اجازه‌ی نصب از منابع ناشناس لازمه). حداقل اندروید ۸.
            - **لینوکس (همه‌ی توزیع‌ها):** `…-linux-x86_64.AppImage` — بعد از دانلود: `chmod +x` و اجرا.
            - **دبیان/اوبونتو:** `…-linux-amd64.deb` — `sudo apt install ./فایل.deb`

            روی لینوکس بدون compositor با `--screenshot` اجرا کن.
          files: release/*
