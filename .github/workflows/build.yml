name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../screen-destroyer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: screen-destroyer.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build AppImage + deb
        working-directory: linux
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            linux/dist/*.AppImage
            linux/dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/android-apk/*.apk
            out/linux/*
