<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Screen Destroyer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="marks"></canvas>
    <canvas id="fx"></canvas>
  </div>

  <div id="toolbar" role="toolbar">
    <div id="tools"></div>
    <div id="bottom">
      <div id="cats">
        <button class="cat" data-cat="weapons"><span>🎯</span><small>سلاح</small></button>
        <button class="cat" data-cat="boom"><span>💥</span><small>انفجار</small></button>
        <button class="cat" data-cat="animals"><span>🐾</span><small>حیوان</small></button>
        <button class="cat" data-cat="bugs"><span>🐜</span><small>حشره</small></button>
      </div>
      <div id="actions">
        <button id="btn-sound" title="صدا"><span>🔊</span></button>
        <button id="btn-clear" title="پاک کردن"><span>🧹</span></button>
        <button id="btn-hide"  title="جمع کردن نوار"><span>⌄</span></button>
        <button id="btn-close" title="خروج"><span>✕</span></button>
      </div>
    </div>
  </div>
  <button id="btn-show" title="نمایش نوار" hidden>⌃</button>

  <script src="sound.js"></script>
  <script src="engine.js"></script>
</body>
</html>
